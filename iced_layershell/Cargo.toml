[package]
name = "iced_layershell"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
readme = "README.md"
description = "layershell binding for iced"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["linux-theme-detection", "automation"]

debug = ["iced_debug/enable"]
time-travel = ["iced_exdevtools/time-travel", "debug"]
unconditional-rendering = []
linux-theme-detection = ["dep:mundy"]
foreign-toplevel = ["layershellev/foreign-toplevel"]
cosmic-toplevel = ["foreign-toplevel", "layershellev/cosmic-toplevel"]
screencopy = ["foreign-toplevel", "layershellev/screencopy"]
workspaces = ["layershellev/workspaces"]
# Lets a test driver on the device read and press widgets, once an admin
# switches it on (see `iced_automation`); without the switch it does nothing.
# On by default, so every layer-shell app gets it with its next bump, as apps
# on iced_winit get it through icetron. Linux only.
automation = ["dep:iced_automation"]

[dependencies]
iced_automation = { workspace = true, optional = true }
iced_renderer.workspace = true
iced_runtime.workspace = true
iced_core.workspace = true
iced_futures.workspace = true
# For `session_hold`, which talks to the compositor on its own connection —
# see that module for why it cannot use the runtime's.
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-scanner.workspace = true
iced_graphics.workspace = true
iced_layershell_macros.workspace = true
iced_program.workspace = true
iced_debug.workspace = true
iced_exdevtools.workspace = true
iced_devtools.workspace = true
tracing.workspace = true
thiserror.workspace = true
layershellev.workspace = true
window_clipboard.workspace = true
log.workspace = true
futures.workspace = true
enumflags2.workspace = true

# workspace features cannot be optional so we need to define the dependency here
mundy = { version = "0.2.0", optional = true }

[dev-dependencies]
iced.workspace = true

[lints]
workspace = true
